name: Publish Blender add-on

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path
          from build_zip import read_version

          version = read_version()
          tag = os.environ["RELEASE_TAG"]
          package = ast.parse(Path("bl_plugin_manager/__init__.py").read_text(encoding="utf-8"))
          info = next(
              ast.literal_eval(node.value) for node in package.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "bl_info" for target in node.targets)
          )
          if (not re.fullmatch(r"(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}", version)
                  or tag != f"v{version}" or ".".join(map(str, info["version"])) != version):
              raise SystemExit(f"Tag {tag} must match both add-on version declarations")
          PY
      - name: Test and build the installable ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B -m unittest discover -s tests -q
          python -B _test/check_ui.py
          python -B _test/audit_features.py
          python -B build_zip.py
          python -B -m zipfile -t "dist/bl_plugin_manager-${RELEASE_TAG#v}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/bl_plugin_manager-${RELEASE_TAG#v}.zip" \
            --verify-tag --generate-notes --latest
